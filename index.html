<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản lý Hạn mức API</title>
  
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quản lý API" />
  
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" type="image/png" href="/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_PROJECTS = [
      { id: 1, name: 'Trợ lý Bài giảng Lớp 4', keyMask: 'AIzaSyD9x8...7kL2', model: 'Gemini 2.0 Flash', spent: 14.50, limit: 30, requests: 19400, active: true },
      { id: 2, name: 'Chấm bài & Nhận xét Tự động', keyMask: 'AIzaSyB4m1...9vN3', model: 'Gemini 1.5 Pro', spent: 18.00, limit: 40, requests: 6250, active: true },
      { id: 3, name: 'Tạo Video Nhân vật Tiếng Việt', keyMask: 'AIzaSyK7p2...3cQ5', model: 'Gemini 1.5 Flash', spent: 5.50, limit: 20, requests: 8900, active: true },
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [exchangeRate] = useState(25450);

      // Quản lý tổng ngân sách ví trả trước
      const [totalDeposited, setTotalDeposited] = useState(() => {
        const saved = localStorage.getItem('qlapi_tracker_deposited');
        return saved !== null ? Number(saved) : 100.00;
      });

      // Danh sách dự án & hạn mức
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('qlapi_tracker_projects');
        return saved ? JSON.parse(saved) : DEFAULT_PROJECTS;
      });

      // Modal states
      const [showModal, setShowModal] = useState(false);
      const [editProject, setEditProject] = useState(null);
      const [name, setName] = useState('');
      const [keyMask, setKeyMask] = useState('');
      const [model, setModel] = useState('Gemini 2.0 Flash');
      const [limit, setLimit] = useState(30);
      const [spent, setSpent] = useState(0);
      const [requests, setRequests] = useState(0);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('qlapi_tracker_deposited', totalDeposited.toString());
      }, [totalDeposited]);

      useEffect(() => {
        localStorage.setItem('qlapi_tracker_projects', JSON.stringify(projects));
      }, [projects]);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const totalUsed = useMemo(() => projects.reduce((sum, p) => sum + Number(p.spent), 0), [projects]);
      const remainingBalance = useMemo(() => Math.max(0, Number((totalDeposited - totalUsed).toFixed(2))), [totalDeposited, totalUsed]);
      const totalRequests = useMemo(() => projects.reduce((sum, p) => sum + Number(p.requests), 0), [projects]);

      const formatVND = (usd) => Math.round(usd * exchangeRate).toLocaleString('vi-VN') + ' ₫';

      const handleSaveProject = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        if (editProject) {
          setProjects(projects.map(p => p.id === editProject.id ? {
            ...p,
            name,
            keyMask: keyMask || p.keyMask,
            model,
            limit: Number(limit) || 10,
            spent: Number(spent) || 0,
            requests: Number(requests) || 0
          } : p));
          notify('Đã cập nhật thông tin dự án!');
        } else {
          const newProj = {
            id: Date.now(),
            name,
            keyMask: keyMask || 'AIzaSy...xxxx',
            model,
            spent: Number(spent) || 0,
            limit: Number(limit) || 30,
            requests: Number(requests) || 0,
            active: true
          };
          setProjects([newProj, ...projects]);
          notify('Đã thêm dự án mới thành công!');
        }
        setShowModal(false);
        setEditProject(null);
        setName('');
        setKeyMask('');
        setSpent(0);
        setRequests(0);
      };

      const openEditModal = (p) => {
        setEditProject(p);
        setName(p.name);
        setKeyMask(p.keyMask);
        setModel(p.model);
        setLimit(p.limit);
        setSpent(p.spent);
        setRequests(p.requests);
        setShowModal(true);
      };

      const toggleActive = (id) => {
        setProjects(projects.map(p => p.id === id ? { ...p, active: !p.active } : p));
      };

      const deleteProject = (id) => {
        setProjects(projects.filter(p => p.id !== id));
        notify('Đã xóa dự án.');
      };

      const addQuickExpense = (id, amount) => {
        setProjects(projects.map(p => {
          if (p.id === id) {
            const newSpent = Number((p.spent + amount).toFixed(2));
            return { ...p, spent: newSpent, requests: p.requests + 250 };
          }
          return p;
        }));
        notify(`Đã cập nhật +$${amount} chi phí thực tế.`);
      };

      return (
        <div className="min-h-screen pb-24 md:pb-8 flex flex-col md:flex-row">
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-indigo-600 text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-semibold">
              {toast}
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="hidden md:flex flex-col w-72 bg-white dark:bg-[#0f1624] border-r border-slate-200/80 dark:border-slate-800 p-6 shrink-0">
            <div className="flex items-center gap-3.5 mb-8">
              <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-cyan-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-indigo-500/30">
                📊
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight">QUẢN LÝ HẠN MỨC</h1>
                <span className="text-[11px] text-emerald-500 font-semibold">● Sổ tay Chi phí AI Studio</span>
              </div>
            </div>

            <div className="mb-6 p-4 rounded-2xl bg-slate-900 text-white shadow-lg space-y-2">
              <div className="flex justify-between text-xs text-slate-400">
                <span>Ngân sách Tổng ví</span>
                <button onClick={() => {
                  const val = prompt('Nhập tổng ngân sách ví ($):', totalDeposited);
                  if (val && !isNaN(val)) setTotalDeposited(Number(val));
                }} className="text-indigo-400 underline text-[10px]">Sửa</button>
              </div>
              <p className="text-2xl font-extrabold">${totalDeposited.toFixed(2)}</p>
              <p className="text-xs text-emerald-400">Còn lại: ${remainingBalance.toFixed(2)}</p>
            </div>

            <nav className="space-y-1.5 flex-1">
              {[
                { id: 'dashboard', label: 'Tổng quan chi phí', icon: '📈' },
                { id: 'projects', label: 'Quản lý Dự án & Key', icon: '🔑' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${
                    activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                  }`}
                >
                  <span>{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              ))}

              <a
                href="https://aistudio.google.com/app/apikey"
                target="_blank"
                rel="noopener noreferrer"
                className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-amber-500 hover:bg-amber-500/10 border border-amber-500/20 mt-4"
              >
                <span>↗</span>
                <span>Mở Google AI Studio</span>
              </a>
            </nav>

            <div className="mt-auto pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
              <span className="text-xs text-slate-500">Giao diện</span>
              <button onClick={() => setDarkMode(!darkMode)} className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold">
                {darkMode ? '🌙 Tối' : '☀️ Sáng'}
              </button>
            </div>
          </aside>

          {/* NỘI DUNG CHÍNH */}
          <main className="flex-1 max-w-5xl mx-auto w-full p-4 md:p-8 space-y-6">
            <div className="flex md:hidden items-center justify-between bg-white dark:bg-[#0f1624] p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">📊</div>
                <div>
                  <h1 className="font-extrabold text-base">QUẢN LÝ HẠN MỨC</h1>
                  <p className="text-[11px] text-emerald-500">Ví: ${remainingBalance.toFixed(2)}</p>
                </div>
              </div>
              <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs">
                {darkMode ? '🌙' : '☀️'}
              </button>
            </div>

            {/* TAB 1: TỔNG QUAN */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="rounded-3xl bg-gradient-to-br from-indigo-600 to-slate-900 text-white p-6 md:p-8 shadow-xl flex flex-col md:flex-row justify-between gap-6">
                  <div>
                    <span className="px-3 py-1 rounded-full bg-white/15 text-xs font-semibold">💡 Sổ Tay Theo Dõi Ngân Sách AI</span>
                    <p className="text-xs uppercase tracking-wider text-indigo-200 mt-3 font-semibold">Số dư ngân sách tổng</p>
                    <h2 className="text-4xl md:text-5xl font-extrabold mt-1">${remainingBalance.toFixed(2)}</h2>
                    <p className="text-xs text-indigo-200 mt-1">Tương đương: {formatVND(remainingBalance)}</p>
                  </div>
                  <div className="flex flex-col justify-end gap-2">
                    <button onClick={() => {
                      setEditProject(null);
                      setName('');
                      setKeyMask('AIzaSy...');
                      setSpent(0);
                      setLimit(30);
                      setShowModal(true);
                    }} className="bg-white text-indigo-700 hover:bg-indigo-50 px-5 py-3 rounded-2xl font-extrabold text-sm shadow-lg">
                      + Thêm Dự Án / Key Mới
                    </button>
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2.5 rounded-xl font-extrabold text-xs text-center shadow"
                    >
                      ↗ Lấy Key từ Google AI Studio
                    </a>
                  </div>
                </div>

                {/* 3 THỐNG KÊ */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white dark:bg-[#0f1624] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-xs text-slate-500">Tổng Ngân Sách Nạp</span>
                    <p className="text-2xl font-extrabold mt-1">${totalDeposited.toFixed(2)}</p>
                  </div>
                  <div className="bg-white dark:bg-[#0f1624] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-xs text-slate-500">Tổng Chi Phí Đã Dùng</span>
                    <p className="text-2xl font-extrabold text-amber-500 mt-1">${totalUsed.toFixed(2)}</p>
                  </div>
                  <div className="bg-white dark:bg-[#0f1624] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-xs text-slate-500">Tổng Lượt Requests Ước Tính</span>
                    <p className="text-2xl font-extrabold text-indigo-500 mt-1">{totalRequests.toLocaleString()}</p>
                  </div>
                </div>

                {/* DANH SÁCH DỰ ÁN */}
                <div className="bg-white dark:bg-[#0f1624] p-5 md:p-6 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-extrabold text-base">Hạn mức chi tiêu theo từng dự án</h3>
                    <button onClick={() => setActiveTab('projects')} className="text-xs text-indigo-500 hover:underline font-bold">Quản lý chi tiết →</button>
                  </div>

                  <div className="space-y-3.5">
                    {projects.map(p => {
                      const percent = Math.min(100, Math.round((p.spent / p.limit) * 100));
                      const isLimitReached = p.spent >= p.limit;
                      return (
                        <div key={p.id} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                          <div className="space-y-1.5 flex-1">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm">{p.name}</span>
                              <span className="text-[11px] px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-500 font-semibold">{p.model}</span>
                              <span className={`text-[11px] px-2 py-0.5 rounded font-bold ${isLimitReached ? 'bg-rose-500/15 text-rose-500' : 'bg-emerald-500/15 text-emerald-500'}`}>
                                {isLimitReached ? '⚠️ Chạm hạn mức' : '● Đang chạy'}
                              </span>
                            </div>
                            <div className="w-full max-w-md bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                              <div className={`h-full ${isLimitReached ? 'bg-rose-500' : 'bg-indigo-600'}`} style={{ width: `${percent}%` }}></div>
                            </div>
                            <div className="flex gap-4 text-xs text-slate-500">
                              <span>Đã dùng: <strong className="text-slate-700 dark:text-slate-200">${p.spent.toFixed(2)}</strong> ({formatVND(p.spent)})</span>
                              <span>Hạn mức: <strong>${p.limit}</strong></span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button onClick={() => addQuickExpense(p.id, 2.00)} className="px-3 py-1.5 rounded-xl bg-indigo-600/10 text-indigo-500 text-xs font-bold hover:bg-indigo-600/20">
                              + Thêm $2 cước
                            </button>
                            <button onClick={() => openEditModal(p)} className="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">
                              Sửa
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: QUẢN LÝ DỰ ÁN */}
            {activeTab === 'projects' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-extrabold">Danh sách Dự án & API Keys</h2>
                    <p className="text-xs text-slate-500">Cập nhật thủ công chi phí lấy từ Google AI Studio vào đây mỗi tuần/tháng.</p>
                  </div>
                  <button onClick={() => {
                    setEditProject(null);
                    setName('');
                    setKeyMask('AIzaSy...');
                    setSpent(0);
                    setLimit(30);
                    setShowModal(true);
                  }} className="bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold">
                    + Thêm Dự Án Mới
                  </button>
                </div>

                <div className="space-y-3">
                  {projects.map(p => (
                    <div key={p.id} className="bg-white dark:bg-[#0f1624] p-5 rounded-3xl border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-base">{p.name}</span>
                          <span className="text-xs px-2.5 py-0.5 rounded bg-indigo-500/10 text-indigo-500 font-semibold">{p.model}</span>
                        </div>
                        <p className="text-xs font-mono text-slate-400 mt-1">Key: {p.keyMask} • Tổng dùng: <strong className="text-amber-500">${p.spent.toFixed(2)}</strong> / ${p.limit}</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => openEditModal(p)} className="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Chỉnh sửa</button>
                        <button onClick={() => deleteProject(p.id)} className="px-3 py-2 rounded-xl bg-rose-500/10 text-rose-500 text-xs font-bold">Xóa</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MENU MOBILE */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-[#0f1624]/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex justify-around py-2 px-1 z-40">
            {[
              { id: 'dashboard', label: 'Tổng quan', icon: '📈' },
              { id: 'projects', label: 'Dự án', icon: '🔑' },
            ].map(tab => (
              <button
                key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center py-1 px-3 rounded-xl text-xs font-semibold ${activeTab === tab.id ? 'text-indigo-500 font-extrabold' : 'text-slate-500'}`}
              >
                <span className="text-base mb-0.5">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* MODAL THÊM / SỬA DỰ ÁN */}
          {showModal && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveProject} className="bg-white dark:bg-[#0f1624] w-full max-w-md rounded-3xl p-6 border border-slate-200 dark:border-slate-800 space-y-4 shadow-2xl">
                <h3 className="font-extrabold text-lg">{editProject ? '✏️ Chỉnh sửa Dự án' : '➕ Thêm Dự án Mới'}</h3>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Tên Dự án / Mục đích *</label>
                  <input
                    type="text" required placeholder="VD: App chấm bài tự động"
                    value={name} onChange={e => setName(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Gợi ý mã Key (để phân biệt)</label>
                  <input
                    type="text" placeholder="AIzaSy...abcd"
                    value={keyMask} onChange={e => setKeyMask(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-sm font-mono"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Model AI</label>
                    <select
                      value={model} onChange={e => setModel(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-sm font-bold"
                    >
                      <option>Gemini 2.0 Flash</option>
                      <option>Gemini 1.5 Pro</option>
                      <option>Gemini 1.5 Flash</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Hạn mức tối đa ($)</label>
                    <input
                      type="number" value={limit} onChange={e => setLimit(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-sm font-bold"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Chi phí thực tế đã dùng ($) — Lấy từ Google AI Studio</label>
                  <input
                    type="number" step="0.01" value={spent} onChange={e => setSpent(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-sm font-bold text-amber-500"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800">Hủy</button>
                  <button type="submit" className="px-5 py-2.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white">Lưu thông tin</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
